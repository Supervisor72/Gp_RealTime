<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Giro Trony Live</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Playfair+Display:wght@900&display=swap" rel="stylesheet">
<style>
:root{--pink:#e0457b;--rosa:#f2a7c3;--bg:#fbeef2;--ink:#1d1d1f;--line:#e9c2d1}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);font-family:Inter,system-ui,sans-serif;color:var(--ink);max-width:560px;margin:0 auto;padding:16px 14px 150px}
.head{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:3px solid var(--ink);padding-bottom:8px}
.head h1{font-family:'Playfair Display',Georgia,serif;font-size:34px;font-weight:900;line-height:.92;letter-spacing:-1px}
.head h1 span{color:var(--pink)}
.head .t{text-align:right;font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;font-weight:800}
.head .t b{display:block;font-size:19px;letter-spacing:0;color:var(--pink)}
.live{display:inline-flex;align-items:center;gap:5px;background:#888;color:#fff;border-radius:4px;padding:2px 7px;font-size:10px;letter-spacing:2px}
.live.on{background:var(--pink)}.live i{width:6px;height:6px;border-radius:50%;background:#fff}.live.on i{animation:p 1.2s infinite}@keyframes p{50%{opacity:.2}}
.card{background:#fff;border-radius:14px;box-shadow:0 2px 0 var(--line)}
.alt{margin:12px 0;padding:10px 12px 4px}
.alt .lbl{display:flex;justify-content:space-between;font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase}
.alt .lbl span{color:var(--pink)}
#rider{transition:transform 1.4s cubic-bezier(.3,.8,.3,1)}
#clipr{transition:width 1.4s cubic-bezier(.3,.8,.3,1)}
.mj-row{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:14px}
.mj{padding:8px 4px;text-align:center;display:flex;flex-direction:column;align-items:center;min-width:0}
.mj small{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;margin-top:2px}
.mj b{font-size:12.5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.mj em{font-style:normal;font-weight:800;color:var(--pink);font-size:12.5px}
.mj i{font-style:normal;font-size:9px;color:#888;margin-top:2px;line-height:1.1}
.mj.flash{animation:fl 1.6s}@keyframes fl{0%,40%{background:#ffd7e6;transform:scale(1.06)}}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;border:2px solid var(--ink);background:#fff;font:800 13px Inter,sans-serif;letter-spacing:1px;text-transform:uppercase;padding:8px;border-radius:30px;cursor:pointer;color:var(--ink)}
.tabs button.on{background:var(--ink);color:#fff}
.race{position:relative}
.sec{position:absolute;left:0;right:0;display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:900;letter-spacing:2px;text-transform:uppercase;height:26px;transition:transform 1s}
.sec:after{content:"";flex:1;height:2px;background:var(--ink)}
.sec em{font-style:normal;color:var(--pink);letter-spacing:0}
.fugabg{position:absolute;left:0;right:0;background:var(--pink);border-radius:14px;transition:height 1s,transform 1s}
.r{position:absolute;left:8px;right:8px;height:40px;display:grid;grid-template-columns:34px 1fr auto 86px;gap:8px;align-items:center;background:#fff;border-radius:9px;padding:0 10px;transition:transform 1s cubic-bezier(.2,.8,.2,1),background .5s,opacity .5s,left 1s,right 1s}
.r.grp{left:0;right:0;border-radius:0;border-bottom:1px dashed #edd3dc}
.r.lead{background:#ffd7e6}
.r .dor{background:var(--ink);color:#fff;font:900 13px ui-monospace,monospace;border-radius:5px;text-align:center;padding:3px 0}
.r .n{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r.grp .n{font-weight:600;font-size:14px}
.r .v{font-weight:800;font-variant-numeric:tabular-nums;font-size:15px}
.r .d{text-align:right;font-size:11px;font-weight:700;color:var(--pink);line-height:1.15}
.r.grp .d{color:#888;font-weight:600}
.r.me .n{color:#b8135a}
.r .st{color:var(--pink)}
.r.stac{background:transparent;border:1.5px dashed #c9a0b1;opacity:.75}
.r.stac .dor{background:#c9a0b1}
.r.stac .n{color:#9a7685;font-weight:700}
.r.up{background:#ffc2d9!important}
.r.arr{animation:arr 2.5s}@keyframes arr{0%{background:var(--pink);color:#fff}}
.pos{color:#13a35a}.neg{color:#d92b2b}
.radio{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--ink);color:#fff;border-radius:14px 14px 0 0;padding:9px 14px 12px}
.radio h4{font-size:10.5px;letter-spacing:2px;color:var(--rosa);margin-bottom:4px;display:flex;justify-content:space-between}
.radio h4 span{color:#aaa;letter-spacing:0;font-weight:600}
#rc{list-style:none;font-size:12.5px;max-height:78px;overflow:hidden}
#rc li{padding:2px 0;border-bottom:1px solid #333;animation:sl .5s}@keyframes sl{from{opacity:0;transform:translateY(-6px)}}
#rc b{color:var(--rosa)}
.msg{display:none;background:#fff;border:2px solid var(--pink);border-radius:10px;padding:9px 12px;font-size:13px;margin:10px 0}.msg.show{display:block}
.msg button,.btn{border:0;background:var(--pink);color:#fff;font:700 13px Inter,sans-serif;padding:8px 13px;border-radius:30px;cursor:pointer;margin-top:6px}
.btn.g{background:var(--ink)}
.foot{font-size:11px;color:#8a6f7b;margin-top:12px;line-height:1.4}
.tot{display:flex;gap:8px;margin-top:12px}.tot div{flex:1;padding:8px 10px}.tot small{display:block;font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#8a6f7b}.tot b{font-size:17px}
.pw{position:fixed;inset:0;background:rgba(251,238,242,.97);display:none;align-items:center;justify-content:center;z-index:99;padding:20px}.pw>div{background:#fff;border:3px solid #1d1d1f;border-radius:16px;padding:22px;width:100%;max-width:340px;text-align:center}.pw h3{font:900 26px 'Playfair Display',Georgia,serif;margin-bottom:4px}.pw p{color:#8a6f7b;font-size:13px;margin-bottom:12px}.pw input{width:100%;padding:12px;border-radius:30px;border:2px solid #e9c2d1;font-size:16px;text-align:center;margin-bottom:10px}.pw button{width:100%;padding:12px;border:0;border-radius:30px;background:#e0457b;color:#fff;font:800 15px Inter,sans-serif;cursor:pointer}.pw .err{color:#d92b2b;font-size:13px;min-height:16px;margin-top:8px}</style></head><body>
<div class="head"><h1>GIRO<br><span>TRONY</span></h1>
<div class="t"><span class="live" id="live"><i></i>LIVE</span><b id="tappa">Tappa del –</b><span id="upd">in attesa del via</span></div></div>
<div class="msg" id="msg"></div>
<div class="alt card"><div class="lbl"><div id="altl">Altimetria</div><span id="km">0 / 36 PDV al traguardo</span></div>
<svg viewBox="0 -34 600 200" width="100%"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0457b" stop-opacity=".6"/><stop offset="1" stop-color="#e0457b" stop-opacity=".05"/></linearGradient><clipPath id="c"><rect id="clipr" x="0" y="-40" width="0" height="200"/></clipPath></defs>
<path id="prof" fill="#f3dbe4"/><path id="prof2" fill="url(#g)" clip-path="url(#c)"/><path id="line" fill="none" stroke="#1d1d1f" stroke-width="2.5"/>
<g id="rider"><g transform="translate(-14,-30)"><circle cx="7" cy="22" r="6" fill="none" stroke="#1d1d1f" stroke-width="2.5"/><circle cx="23" cy="22" r="6" fill="none" stroke="#1d1d1f" stroke-width="2.5"/><path d="M7 22 L13 12 L21 12 L23 22 M13 12 L16 5 M14 5 L19 5" stroke="#e0457b" stroke-width="2.5" fill="none" stroke-linecap="round"/><circle cx="17" cy="1" r="3" fill="#1d1d1f"/></g></g>
<g id="axis" font-family="Inter" font-size="10" font-weight="800"></g></svg></div>
<div class="mj-row" id="maglie"></div>
<div class="tabs"><button id="tDay" class="on">Tappa di oggi</button><button id="tDelta">Classifica mese</button></div>
<div class="race" id="race"></div>
<div class="tot" id="tot" style="display:none"></div>
<div class="foot" id="foot"></div>
<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="btn" id="refresh">Aggiorna ora</button><button class="btn g" id="jpgDay">📷 JPG giorno</button><button class="btn g" id="jpgMonth">📷 JPG mese</button><button class="btn g" id="demo">Simula tappa (demo)</button></div>
<details style="margin-top:12px;font-size:13px"><summary style="cursor:pointer;font-weight:700">➕ Aggiungi venduto a mano</summary>
<form id="manform" style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap"><select id="manpdv" style="flex:1;min-width:140px;padding:8px;border-radius:6px"></select><input id="manval" inputmode="decimal" placeholder="es. 49830,78" style="flex:1;min-width:110px;padding:8px;border-radius:6px;border:1px solid #999"><button class="btn" type="submit" style="margin:0">Aggiungi</button></form><div id="manmsg" style="margin-top:6px"></div></details>
<div class="radio"><h4>📻 RADIO CORSA <span id="clock"></span></h4><ul id="rc"><li>In attesa della partenza…</li></ul></div>
<div class="pw" id="pwbox"><div><h3>🚴 GIRO TRONY</h3><p>Inserisci la password per seguire la corsa</p><form id="pwform"><input type="password" id="pwin" placeholder="Password" autocomplete="current-password"><button type="submit">Entra</button></form><div class="err" id="pwerr"></div></div></div>
<script>
const PDV=[["Avezzano","AVE"],["Bologna","BOL"],["Carpi","CAR"],["Cesena","CES"],["Chioggia","CHI"],["Città di Castello","CDC"],["Civitanova","CIV"],["Conegliano","CON"],["Fabriano","FAB"],["Faenza","FAE"],["Fano","FAN"],["Foligno","FOL"],["Forlì","FOR"],["Imola","IMO"],["L'Aquila","AQU"],["Lanciano","LAN"],["Macerata","MAC"],["Maranello","MAR"],["Monsano","MNS"],["Osimo","OSI"],["Padova","PAD"],["Perugia","PER"],["Pesaro","PSR"],["Pescara","PES"],["Reggio Emilia","REG"],["Rieti","RIE"],["Rimini","RIM"],["Roma","ROM"],["San Benedetto","SBT"],["San Marino","SMR"],["Santa Maria di Sala","SMS"],["Teramo","TER"],["Termoli","TRM"],["Vasto","VAS"],["Vicenza","VIC"],["Viterbo","VIT"]];
const MINE=new Set(["Osimo","Civitanova","Pesaro","Macerata","Monsano","Fano"]);
// AC netto al 21/11/2026 e AP 01/11-22/11/2025 (da Power BI)
const BASE={"Pescara": [817695, 934783], "Osimo": [606292, 673435], "Vasto": [574824, 626441], "Macerata": [518533, 588541], "Civitanova": [506867, 544358], "Padova": [494442, 674530], "Avezzano": [486057, 549478], "Foligno": [483838, 612423], "Pesaro": [471634, 523107], "Bologna": [465026, 674119], "Lanciano": [454994, 509834], "Teramo": [450995, 512272], "L'Aquila": [444969, 479961], "Monsano": [419670, 534599], "Città di Castello": [403955, 477398], "Fano": [399349, 407667], "Termoli": [380341, 432433], "Viterbo": [377830, 574636], "Faenza": [373242, 464777], "Carpi": [371698, 464427], "Forlì": [360541, 384041], "Reggio Emilia": [360402, 397330], "Maranello": [357302, 455200], "Chioggia": [352976, 442528], "San Marino": [351027, 331749], "San Benedetto": [348874, 437057], "Conegliano": [336268, 501547], "Rieti": [318805, 430996], "Rimini": [306777, 334290], "Santa Maria di Sala": [283841, 371418], "Vicenza": [272367, 300600], "Imola": [232218, 286819], "Fabriano": [230208, 250949], "Cesena": [228312, 261829]};
const BASE_DATE="2026-11-23"; // giorno a cui si riferisce l'AP (01/11–23/11/2025)
const IVA=1.22;
// controcifre 2025 (stesso giorno anno scorso, netto) – valide solo nel giorno CONTRO_DATE
const CONTRO_DATE="2026-11-23";
const CONTRO={"Pescara": 92877, "Osimo": 75512, "Bologna": 69876, "Viterbo": 69685, "Foligno": 65573, "Avezzano": 65065, "Padova": 61429, "Civitanova": 59451, "Macerata": 57954, "Vasto": 56500, "Lanciano": 51385, "Città di Castello": 47594, "Carpi": 46152, "Monsano": 45500, "Pesaro": 44375, "Conegliano": 43964, "Faenza": 42971, "Fano": 39418, "San Benedetto": 38247, "Teramo": 36987, "Reggio Emilia": 33368, "Rieti": 32742, "Chioggia": 32541, "Santa Maria di Sala": 32378, "L'Aquila": 31209, "Maranello": 30099, "Termoli": 29550, "San Marino": 26287, "Forlì": 25356, "Rimini": 24477, "Fabriano": 21550, "Vicenza": 18960, "Cesena": 18623, "Imola": 17586};
function controPct(n,v){const d=new Date(),k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");if(k!==CONTRO_DATE||!CONTRO[n]||v==null)return null;return (v/IVA-CONTRO[n])/CONTRO[n]*100;}
// AC netto al 21/11 anche per Roma e Perugia (senza anno precedente)
const AC_EXTRA={"Roma":539326,"Perugia":322257};
function monthRows(){return NAMES.map(n=>{const ac=BASE[n]?BASE[n][0]:AC_EXTRA[n];const t=today[n]!=null?today[n]/IVA:0;const tot=ac+t;const ap=BASE[n]?BASE[n][1]:null;return{n,v:tot,t,ap,p:ap?(tot-ap)/ap*100:null,pit:today[n]==null};}).sort((a,b)=>b.v-a.v);}
const CODE=Object.fromEntries(PDV), NAMES=PDV.map(p=>p[0]);
const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/[^A-Z]/g,'');
const KEY=Object.fromEntries(NAMES.map(n=>[norm(n),n]));
KEY["SMARIADISALA"]="Santa Maria di Sala";KEY["SANBENEDETTODELTRONTO"]="San Benedetto";KEY["CDC"]="Città di Castello";KEY["AQUILA"]="L'Aquila";KEY["REGGIOEMILIA"]="Reggio Emilia";KEY["MONZANO"]="Monsano";
const fmt=v=>String(Math.abs(Math.round(v))).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const eur=v=>'€ '+(v<0?'−':'')+fmt(v);
const sgn=v=>(v>=0?'+':'−')+'€ '+fmt(v);

let today={};      // nome -> venduto ivato
let arrivedAt={};  // nome -> ms
let view='day', prevPit={}, prevOrder={}, firstLoad=true, lastFetch=null;


let entryPos={},lastJ={},demoTimer=null;
function findPdv(subject,sender){
  let s=norm((subject||'').replace(/(GENNAIO|FEBBRAIO|MARZO|APRILE|MAGGIO|GIUGNO|LUGLIO|AGOSTO|SETTEMBRE|OTTOBRE|NOVEMBRE|DICEMBRE).*$/i,''));
  if(KEY[s])return KEY[s];
  for(const k in KEY) if(s && (s.startsWith(k)||k.startsWith(s)) && Math.min(s.length,k.length)>=4) return KEY[k];
  const m=(sender||'').toLowerCase().match(/trony\.?([a-z]+)@/);
  if(m){const k=norm(m[1]); for(const kk in KEY) if(kk.startsWith(k)||k.startsWith(kk)) return KEY[kk];}
  return null;
}
function parseVal(t){
  const m=(t||'').match(/VENDUTO\s+GIORNALIERO[^0-9\-]*?([\d\.]+(?:,\d{1,2})?)/i);
  if(!m)return null;
  return parseFloat(m[1].replace(/\./g,'').replace(',','.'));
}
function todayStr(d=new Date()){return d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0');}
function isToday(dateStr){if(!dateStr)return true;const d=new Date(dateStr),n=new Date();return d.toDateString()===n.toDateString();}

function ingest(payload){
  const threads=(payload&&payload.threads)||[];
  const next={...today};
  for(const th of threads){
    for(const m of (th.messages||[])){
      if(!isToday(m.date))continue;
      const name=findPdv(m.subject,m.sender), v=parseVal(m.snippet);
      if(name&&v!=null){ if(next[name]==null){arrivedAt[name]=Date.now(); if(!firstLoad) rc(`🏁 <b>${name.toUpperCase()}</b> taglia il traguardo · ${eur(v)}`);} next[name]=v; }
    }
  }
  today=next; firstLoad=false; render();
}


// ----- altimetria -----
const PTS=[[0,120],[60,110],[110,85],[150,95],[200,60],[250,70],[300,40],[340,55],[390,20],[420,35],[470,15],[520,30],[560,10],[600,22]];
const P='M'+PTS.map(p=>p.join(',')).join(' L');
document.getElementById('prof').setAttribute('d',P+' L600,140 L0,140Z');document.getElementById('prof2').setAttribute('d',P+' L600,140 L0,140Z');document.getElementById('line').setAttribute('d',P);
function yAt(x){for(let i=0;i<PTS.length-1;i++){const[a,b]=PTS[i],[c,d]=PTS[i+1];if(x>=a&&x<=c)return b+(d-b)*(x-a)/(c-a);}return PTS[PTS.length-1][1];}
const NOW=new Date(),GG=NOW.getDate(),DIM=new Date(NOW.getFullYear(),NOW.getMonth()+1,0).getDate(),MESE=NOW.toLocaleDateString('it-IT',{month:'long'});
(function(){let h='';for(let d=1;d<=DIM;d++){const x=600*(d-.5)/DIM,cur=d===GG,past=d<GG;h+=`<line x1="${x}" y1="141" x2="${x}" y2="${cur?150:146}" stroke="${cur?'#e0457b':'#1d1d1f'}" stroke-width="${cur?2.5:1}" opacity="${past||cur?1:.35}"/>`;if(cur||d===1||d===DIM||(d%5===0&&Math.abs(d-GG)>1))h+=`<text x="${x}" y="${cur?150:150}" dy="10" text-anchor="middle" fill="${cur?'#e0457b':'#1d1d1f'}" font-size="${cur?12:10}" opacity="${past||cur?1:.45}">${d}</text>`;}
h+=`<text x="598" y="2" text-anchor="end">🏁</text>`;document.getElementById('axis').innerHTML=h;})();
function altimetria(n){const x=600*((GG-1)+n/36)/DIM;document.getElementById('rider').setAttribute('transform',`translate(${x},${yAt(x)})`);document.getElementById('clipr').setAttribute('width',x);document.getElementById('km').textContent=`${n}/36 al traguardo`;}
// ----- maglie -----
function jersey(col,dots){const id='p'+Math.random().toString(36).slice(2,7);const pat=dots?`<pattern id="${id}" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#fff"/><circle cx="4" cy="4" r="2.2" fill="#d6001c"/></pattern>`:'';return `<svg viewBox="0 0 64 56" width="52" height="45"><defs>${pat}</defs><path d="M20 4 L8 10 L1 26 L11 31 L15 22 L15 54 L49 54 L49 22 L53 31 L63 26 L56 10 L44 4 C42 10 22 10 20 4Z" fill="${dots?`url(#${id})`:col}" stroke="#222" stroke-width="2" stroke-linejoin="round"/></svg>`;}
const star=n=>MINE.has(n)?' <span class="st">★</span>':'';
function deltaRows(){return Object.keys(BASE).map(n=>{const[ac,ap]=BASE[n];const t=today[n]!=null?today[n]/IVA:0;const acn=ac+t;return{n,ac:acn,ap,d:acn-ap,p:(acn-ap)/ap*100,pit:today[n]==null};}).sort((a,b)=>b.p-a.p);}
function dayRows(){return NAMES.map(n=>({n,v:today[n],pit:today[n]==null})).sort((a,b)=>(a.pit-b.pit)||((b.v||0)-(a.v||0))||a.n.localeCompare(b.n));}
function maglie(D){
  const got=D.filter(r=>!r.pit);const dr=deltaRows()[0];
  let cic=null,best=0;got.forEach((r,i)=>{const g=(entryPos[r.n]??i)-i;if(g>best){best=g;cic=r;}});
  const mine=got.find(r=>MINE.has(r.n));
  const J=[['#f2a7c3',0,'Maglia rosa','1° tappa di oggi',got[0]?got[0].n:'—',got[0]?eur(got[0].v):''],
    ['#fff',1,'Maglia a pois','Miglior delta % mese',dr.n,(dr.p>=0?'+':'−')+Math.abs(dr.p).toFixed(2).replace('.',',')+'%'],
    ['#c51f8a',0,'Maglia ciclamino','Più posizioni guadagnate',cic?cic.n:'—',cic?'▲ '+best+(best==1?' posto':' posti'):''],
    ['#ffffff',0,'Maglia bianca','Migliore dei 6 di Diego',mine?mine.n:'—',mine?eur(mine.v):'']];
  const box=document.getElementById('maglie');
  if(!box.children.length)box.innerHTML=J.map(()=>'<div class="mj card"></div>').join('');
  J.forEach((j,k)=>{const el=box.children[k];const key=j[4];el.innerHTML=`${jersey(j[0],j[1])}<small>${j[2]}</small><b>${j[4]}${star(j[4])}</b><em>${j[5]}</em><i>${j[3]}</i>`;
    if(lastJ[k]&&lastJ[k]!==key&&key!=='—'){el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');if(k===0)rc(`🌸 <b>${key.toUpperCase()}</b> indossa la maglia rosa`);}
    lastJ[k]=key;});
}
// ----- corsa -----
const H=44,FUGA=4,els={};
function render(){
  const D=dayRows();const got=D.filter(r=>!r.pit).length;
  D.forEach((r,i)=>{if(!r.pit&&entryPos[r.n]==null)entryPos[r.n]=i;});
  altimetria(got);maglie(D);
  const race=document.getElementById('race');
  let R,mode=view;
  if(view==='day'){R=D;}else{R=monthRows();}
  const nF=view==='day'?Math.min(FUGA,got):FUGA;
  const nG=R.filter(r=>!(view==='day'&&r.pit)).length-nF;
  // layout y
  const y0=0,fugaTop=30,fugaH=nF?nF*H+8:0,grpHead=fugaTop+fugaH+12,grpTop=grpHead+30,stHead=grpTop+Math.max(nG,0)*H+12,stTop=stHead+30;

  const seen=new Set(),passes=[];
  R.forEach((r,i)=>{
    const k=view+r.n;seen.add(k);let el=els[k];

}

async function fetchOnce(){

const JPG_THEME={bg:'#fbeef2',band:'#e0457b',ink:'#1d1d1f',mut:'#8a6f7b',accent:'#e0457b',row:'#ffffff',row2:'#fff7fa',posBg:'#1d1d1f',posInk:'#fff',gold:'#f2a7c3',silver:'#e6e6ea',bronze:'#f4c9a8',mineBg:'#ffd7e6',mineInk:'#b8135a',up:'#13a35a',dn:'#d92b2b',font:"Inter,system-ui,sans-serif",italic:false,title:'GIRO TRONY',dayLabel:`TAPPA ${GG} · ${NOME_TAPPA.toUpperCase()}`,monthLabel:'CLASSIFICA DEL MESE',file:'Giro_Trony'};
// ---------- SCARICA JPG ----------
const JPG_DAY=()=>NAMES.map(n=>({n,v:today[n],pit:today[n]==null})).sort((a,b)=>(a.pit-b.pit)||((b.v||0)-(a.v||0))||a.n.localeCompare(b.n));
const JPG_MONTH=()=>NAMES.map(n=>{const ac=BASE[n]?BASE[n][0]:JPG_AC_EXTRA[n];const t=today[n]!=null?today[n]/IVA:0;const tot=ac+t;const ap=BASE[n]?BASE[n][1]:null;return{n,v:tot,p:ap?(tot-ap)/ap*100:null};}).sort((a,b)=>b.v-a.v);
const JPG_AC_EXTRA={"Roma":539326,"Perugia":322257};
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
async function scaricaJpg(tipo){
  const T=JPG_THEME, W=1080, RH=58, top=250, R=tipo==='giorno'?JPG_DAY():JPG_MONTH();
  const H=top+R.length*RH+90;
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;const ctx=cv.getContext('2d');ctx.textBaseline='middle';
  try{await document.fonts.ready;}catch(e){}
  ctx.fillStyle=T.bg;ctx.fillRect(0,0,W,H);
  if(T.band){ctx.fillStyle=T.band;ctx.fillRect(0,0,W,12);}
  const now=new Date(),dd=now.toLocaleDateString('it-IT',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'}),hh=now.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
  ctx.textBaseline='alphabetic';ctx.fillStyle=T.ink;ctx.font=`900 ${T.italic?'italic ':''}64px ${T.font}`;ctx.fillText(T.title,60,110);
  ctx.fillStyle=T.accent;{const lbl=tipo==='giorno'?(T.dayLabel||'VENDUTO DI OGGI'):(T.monthLabel||'CLASSIFICA MESE');let fs=38;do{ctx.font=`800 ${fs}px ${T.font}`;fs--;}while(ctx.measureText(lbl).width>W-120&&fs>18);ctx.fillText(lbl,60,165);}
  ctx.fillStyle=T.mut;ctx.font=`600 26px ${T.font}`;ctx.fillText(`${dd} · ore ${hh}`+(tipo==='giorno'?' · IVA inclusa':' · netto IVA, AC + oggi'),60,208);
  const lead=R[0]&&R[0].v||0;ctx.textBaseline='middle';
  R.forEach((r,i)=>{const y=top+i*RH, mine=MINE.has(r.n), pit=tipo==='giorno'&&r.pit;
    ctx.fillStyle=mine?T.mineBg:(i%2?T.row2:T.row);rr(ctx,40,y,W-80,RH-8,12);ctx.fill();
    const medal=[T.gold,T.silver,T.bronze][i];
    ctx.fillStyle=pit?T.mut:(medal&&!pit?medal:T.posBg);rr(ctx,52,y+8,64,RH-24,8);ctx.fill();
    ctx.fillStyle=pit?T.bg:(medal?'#1d1d1f':T.posInk);ctx.font=`900 28px ${T.font}`;ctx.textAlign='center';ctx.fillText(pit?'–':String(i+1),84,y+RH/2+2);
    ctx.textAlign='left';ctx.fillStyle=pit?T.mut:(mine?T.mineInk:T.ink);ctx.font=`${mine?800:700} 30px ${T.font}`;ctx.fillText(r.n+(mine?'  ★':''),140,y+RH/2+2);
    ctx.textAlign='right';ctx.fillStyle=pit?T.mut:T.ink;ctx.font=`800 30px ${T.font}`;ctx.fillText(pit?'—':eur(r.v),760,y+RH/2+2);
    let g,gc=T.mut;
    if(tipo==='giorno'){g=pit?'mail non arrivata':(controPct('Pescara',1)!=null&&!CONTRO[r.n]?'nuovo (no 2025)':(i===0?'LEADER':'−'+fmt(lead-r.v)));const cp=pit?null:controPct(r.n,r.v);if(cp!=null){const dif=r.v/IVA-CONTRO[r.n];ctx.fillStyle=dif>=0?T.up:T.dn;ctx.font=`800 26px ${T.font}`;ctx.textAlign='right';ctx.fillText((dif>=0?'+':'−')+'€ '+fmt(dif),W-60,y+RH/2+2);ctx.textAlign='left';return;}}
    else{g=r.p==null?'nuovo':(r.p>=0?'+':'−')+Math.abs(r.p).toFixed(1).replace('.',',')+'% vs 2025';gc=r.p==null?T.mut:(r.p>=0?T.up:T.dn);}
    ctx.fillStyle=gc;ctx.font=`700 24px ${T.font}`;ctx.fillText(g,W-60,y+RH/2+2);ctx.textAlign='left';
  });
  ctx.textBaseline='alphabetic';

  ctx.fillStyle=T.mut;ctx.font=`600 22px ${T.font}`;ctx.fillText('★ = PDV di Diego'+(tipo==='giorno'&&controPct('Pescara',1)!=null?' · a destra: scarto in € dalla controcifra 2025 (netto IVA)':'')+(tipo==='giorno'?` · ${Object.keys(today).length}/36 mail arrivate`:''),60,H-42);
  const blob=await new Promise(res=>cv.toBlob(res,'image/jpeg',0.92));
  const name=`${T.file}_${tipo}_${now.toISOString().slice(0,10)}.jpg`;
  const file=new File([blob],name,{type:'image/jpeg'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return;}}catch(e){if(e&&e.name==='AbortError')return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
}
